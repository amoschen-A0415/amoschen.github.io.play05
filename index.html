<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>益智遊戲大觀園 (Puzzle Master Hub)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showCategories()">
                <i class="fa-solid fa-puzzle-piece text-3xl text-yellow-300"></i>
                <h1 class="text-2xl font-bold tracking-wide">益智遊戲大觀園</h1>
            </div>
            <button onclick="showCategories()" id="home-btn" class="hidden flex items-center gap-2 bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg text-sm transition">
                <i class="fa-solid fa-house"></i> 回大廳
            </button>
        </div>
    </header>

    <!-- 麵包屑導航 -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-2 text-sm text-slate-600 flex items-center space-x-2" id="breadcrumb">
            <span class="hover:text-indigo-600 cursor-pointer" onclick="showCategories()">首頁</span>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- 1. 分類列表視圖 (Category View) -->
        <div id="category-view" class="space-y-6">
            <div class="text-center max-w-2xl mx-auto mb-10">
                <h2 class="text-3xl font-extrabold text-slate-900 mb-2">探索 9 大益智遊戲領域</h2>
                <p class="text-slate-600">挑選一個你感興趣的類型，鍛鍊邏輯、記憶、空間感與反應力！</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="category-grid">
                <!-- 由 JavaScript 自動動態生成 9 大分類 -->
            </div>
        </div>

        <!-- 2. 子遊戲列表視圖 (Sub-Game List View) -->
        <div id="subgame-view" class="hidden space-y-6">
            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-indigo-900 flex items-center gap-3" id="cat-title">
                        <!-- 動態寫入類型標題 -->
                    </h2>
                    <p class="text-slate-600 mt-2" id="cat-desc"><!-- 動態寫入類型說明 --></p>
                </div>
                <button onclick="showCategories()" class="text-indigo-600 hover:text-indigo-800 font-medium text-sm flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-arrow-left"></i> 返回所有分類
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="subgame-grid">
                <!-- 由 JavaScript 自動動態生成 3 種子遊戲 -->
            </div>
        </div>

        <!-- 3. 遊戲小試身手視圖 (Game Play View) -->
        <div id="game-detail-view" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-lg border p-6 md:p-8">
                <div class="flex justify-between items-center border-b pb-4 mb-6">
                    <div>
                        <span id="game-cat-badge" class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-xs font-semibold"></span>
                        <h2 class="text-3xl font-bold text-slate-800 mt-2" id="game-title"></h2>
                    </div>
                    <button onclick="backToSubGames()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition">
                        <i class="fa-solid fa-arrow-left mr-1"></i> 返回分類
                    </button>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- 遊戲說明側邊欄 -->
                    <div class="space-y-4 lg:col-span-1 border-r border-slate-100 pr-0 lg:pr-6">
                        <div>
                            <h3 class="font-bold text-slate-700 mb-1 flex items-center gap-2"><i class="fa-solid fa-circle-info text-indigo-500"></i> 遊戲簡介</h3>
                            <p class="text-slate-600 text-sm leading-relaxed" id="game-desc"></p>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-700 mb-1 flex items-center gap-2"><i class="fa-solid fa-book-open text-indigo-500"></i> 規則與玩法</h3>
                            <p class="text-slate-600 text-sm leading-relaxed" id="game-rules"></p>
                        </div>
                        <div class="pt-2">
                            <span class="text-xs text-slate-400">難易度：</span>
                            <span id="game-diff" class="text-xs font-bold text-amber-500"></span>
                        </div>
                    </div>

                    <!-- 遊戲實體互動區域 -->
                    <div class="lg:col-span-2 bg-slate-50 border rounded-xl p-6 flex flex-col items-center justify-center min-h-[350px]" id="game-playground">
                        <!-- 互動遊戲會在這裡動態渲染 -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 頁腳 -->
    <footer class="bg-slate-800 text-slate-400 py-6 text-center text-sm mt-auto">
        <p>© 益智遊戲大觀園 - 鍛鍊腦力與邏輯的最佳平台</p>
    </footer>

    <!-- JavaScript 邏輯與 9x3 完整資料 -->
    <script>
        // 9 大類別及各自 3 個遊戲的完整結構
        const puzzleData = [
            {
                id: 'numeric',
                name: '數字邏輯類',
                icon: 'fa-hashtag',
                color: 'bg-blue-500',
                desc: '透過數字推算、幾何運算與邏輯盤面，訓練數感與推理能力。',
                games: [
                    { id: 'sudoku', name: '數獨 (Sudoku)', diff: '中等', desc: '經典的 9x9 數字填充遊戲。', rules: '在網格中填入 1~9 數字，使每行、每列及每個 3x3 宮格內的數字皆不重複。' },
                    { id: '2048', name: '2048', diff: '簡單', desc: '熱門滑動數字合併遊戲。', rules: '滑動方塊使相同數字合併相加，目標是拼出 2048 方塊。' },
                    { id: 'bulls_cows', name: '1A2B 幾A幾B', diff: '中等', desc: '邏輯數字猜測遊戲。', rules: '猜測 4 位不重複數字，數字與位置皆對為 A，數字對位置錯為 B。' }
                ]
            },
            {
                id: 'spatial',
                name: '圖形空間類',
                icon: 'fa-shapes',
                color: 'bg-emerald-500',
                desc: '考驗立體旋轉、形狀拼接與空間想像力。',
                games: [
                    { id: 'tangram', name: '七巧板 (Tangram)', diff: '簡單', desc: '傳統多邊形組合 puzzle。', rules: '使用七塊特定形狀的圖形拼板，拼出指定的輪廓形狀。' },
                    { id: 'tetris', name: '俄羅斯方塊 (Tetris)', diff: '簡單', desc: '動態空間擺放與下落累積遊戲。', rules: '旋轉並移動下落的方塊，填滿一整行即可消除得分。' },
                    { id: 'spatial_rotation', name: '展開圖與透視 (3D Fold)', diff: '困難', desc: '訓練 3D 空間建構力的測驗。', rules: '根據 2D 平面展開圖，推算出折疊後的 3D 立體圖形樣貌。' }
                ]
            },
            {
                id: 'word',
                name: '文字解謎類',
                icon: 'fa-font',
                color: 'bg-purple-500',
                desc: '結合字彙量、成語語感與語言推演的字詞謎題。',
                games: [
                    { id: 'crossword', name: '填字遊戲 (Crossword)', diff: '中等', desc: '交叉字詞網格填充。', rules: '根據提示在直橫交錯的格字中填入對應的詞彙。' },
                    { id: 'idiom_fill', name: '成語接龍 / 填空', diff: '簡單', desc: '考驗中文成語庫存。', rules: '利用上下文提示或首尾字接續，填補出正確的成語。' },
                    { id: 'wordle', name: 'Wordle 猜字', diff: '中等', desc: '英文五字單字推論遊戲。', rules: '有 6 次機會猜測 5 字母單字，綠色代表位置正確，黃色代表字母存在。' }
                ]
            },
            {
                id: 'memory',
                name: '記憶觀察類',
                icon: 'fa-brain',
                color: 'bg-amber-500',
                desc: '考驗短期記憶力、視覺專注度與細節比對。',
                games: [
                    { id: 'card_match', name: '翻牌記憶 (Memory Match)', diff: '簡單', desc: '經典翻牌配對遊戲。', rules: '翻開兩張相同的卡牌即可配對消除，考驗短期圖像記憶。' },
                    { id: 'spot_difference', name: '找不同 (Spot Difference)', diff: '簡單', desc: '細節觀察力比對。', rules: '在兩張極為相似的圖片中找出細微的相異之處。' },
                    { id: 'simon_says', name: '西蒙燈光記憶 (Simon)', diff: '中等', desc: '序列與節奏記憶。', rules: '觀察燈光與聲音播放的順序，並按完全相同的順序重複點擊。' }
                ]
            },
            {
                id: 'physics',
                name: '物理力學類',
                icon: 'fa-apple-whole',
                color: 'bg-rose-500',
                desc: '運用重力、槓桿、傳導與連鎖反應解開謎題。',
                games: [
                    { id: 'pipe_connect', name: '接水管 (Water Pipes)', diff: '簡單', desc: '管道方向連接遊戲。', rules: '旋轉不同形狀的水管，將起點的水流成功引導至終點。' },
                    { id: 'cut_rope', name: '割繩子 (Cut the Rope)', diff: '中等', desc: '重力與擺盪時機計算。', rules: '在適當的時間剪斷繩子，讓物體利用重力和慣性掉入目標點。' },
                    { id: 'balance_bridge', name: '造橋專家 (Bridge Builder)', diff: '困難', desc: '結構受力與力學設計。', rules: '利用受限的預算搭建橋樑，使其能承受車輛通過的重量。' }
                ]
            },
            {
                id: 'board',
                name: '棋牌對弈類',
                icon: 'fa-chess',
                color: 'bg-indigo-500',
                desc: '雙人或單人策略計算，預判對手步驟與全局佈局。',
                games: [
                    { id: 'gomoku', name: '五子棋 (Gomoku)', diff: '簡單', desc: '連珠攻防棋類遊戲。', rules: '雙方輪流下子，率先在直、橫、斜方向連成五子者獲勝。' },
                    { id: 'reversi', name: '黑白棋 (Reversi / Othello)', diff: '中等', desc: '翻轉夾擊棋類。', rules: '將棋子下在能包夾對方棋子的位置，即可將對手的棋子翻轉為己方顏色。' },
                    { id: 'chess', name: '西洋棋 / 將棋謎題', diff: '困難', desc: '殘局解謎 (Chess Puzzles)。', rules: '給定特定盤面殘局，要求在限定步數內完成將死 (Checkmate)。' }
                ]
            },
            {
                id: 'maze',
                name: '迷宮闖關類',
                icon: 'fa-route',
                color: 'bg-teal-500',
                desc: '路徑搜尋、推箱規劃與避開障礙到達終點。',
                games: [
                    { id: 'sokoban', name: '推箱子 (Sokoban)', diff: '中等', desc: '空間規劃與順序推導。', rules: '控制角色將所有箱子推到指定的目標點，箱子只能推不能拉。' },
                    { id: 'classic_maze', name: '經典迷宮 (Classic Maze)', diff: '簡單', desc: '視覺路徑追蹤。', rules: '在錯綜複雜的通路中找出從入口到達出口的唯一正確路線。' },
                    { id: 'unblock_me', name: '華容道 / 滑塊Puzzle', diff: '中等', desc: '位移卡位解鎖。', rules: '移動其他障礙木條，為指定的紅色木條開闢出一條滑出出口的道路。' }
                ]
            },
            {
                id: 'probability',
                name: '機率賽局類',
                icon: 'fa-dice',
                color: 'bg-orange-500',
                desc: '分析風險與回報，在不確定性中做出最佳期望值決策。',
                games: [
                    { id: 'minesweeper', name: '踩地雷 (Minesweeper)', diff: '中等', desc: '機率與邏輯推算並重。', rules: '根據格子顯示的周圍地雷數量提示，找出所有安全格子並標記地雷。' },
                    { id: 'monty_hall', name: '三門問題 (Monty Hall)', diff: '簡單', desc: '直覺與反直覺機率實驗。', rules: '選擇一扇門後，主持人開啟一扇空門，選擇「換門」或「不換門」來提高獲勝率。' },
                    { id: 'poker_puzzle', name: '德州撲克殘局 (Poker Odds)', diff: '困難', desc: '勝率計算與期望值分析。', rules: '根據手牌與公牌，計算底牌勝率並做出最符合期望值的押注決策。' }
                ]
            },
            {
                id: 'scenario',
                name: '生活情境類',
                icon: 'fa-user-gear',
                color: 'bg-cyan-500',
                desc: '模擬現實場景中的資源分配、排程與情境問題解決。',
                games: [
                    { id: 'river_crossing', name: '狼羊菜過河問題', diff: '簡單', desc: '條件約束與互斥排程。', rules: '在一次只能帶一樣東西且特定組合不能單獨相處的條件下，將所有物品安全運過河。' },
                    { id: 'traffic_control', name: '交通紅綠燈調控', diff: '中等', desc: '瓶頸與流量控管。', rules: '調整各路口的紅綠燈時長，防止車輛堵塞並達到最大通行效率。' },
                    { id: 'resource_mgmt', name: '時間與時間表排程', diff: '中等', desc: '關鍵路徑與時間管理。', rules: '在有限時間與人力下，規劃各項任務的優先順序以獲得最大效益。' }
                ]
            }
        ];

        // 當前狀態
        let currentCatIndex = null;
        let currentGame = null;

        // 初始化
        window.onload = function() {
            renderCategories();
        };

        // 渲染 9 大分類
        function renderCategories() {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = '';

            puzzleData.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-md hover:shadow-xl transition duration-300 p-6 cursor-pointer border border-slate-100 flex flex-col justify-between group";
                card.onclick = () => showSubGames(index);

                card.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-4 mb-4">
                            <div class="w-12 h-12 rounded-lg ${cat.color} text-white flex items-center justify-center text-xl shadow-md group-hover:scale-110 transition duration-300">
                                <i class="fa-solid ${cat.icon}"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-slate-800 group-hover:text-indigo-600 transition">${cat.name}</h3>
                                <span class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded">3 種遊戲</span>
                            </div>
                        </div>
                        <p class="text-slate-600 text-sm mb-4 leading-relaxed">${cat.desc}</p>
                    </div>
                    <div class="border-t pt-3 flex justify-between items-center text-xs text-indigo-600 font-semibold">
                        <span>點擊進入探索</span>
                        <i class="fa-solid fa-chevron-right group-hover:translate-x-1 transition"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 顯示大廳
        function showCategories() {
            document.getElementById('category-view').classList.remove('hidden');
            document.getElementById('subgame-view').classList.add('hidden');
            document.getElementById('game-detail-view').classList.add('hidden');
            document.getElementById('home-btn').classList.add('hidden');
            
            // 更新麵包屑
            document.getElementById('breadcrumb').innerHTML = `<span class="font-semibold text-slate-800">首頁大廳</span>`;
        }

        // 顯示子遊戲列表
        function showSubGames(catIndex) {
            currentCatIndex = catIndex;
            const cat = puzzleData[catIndex];

            document.getElementById('category-view').classList.add('hidden');
            document.getElementById('subgame-view').classList.remove('hidden');
            document.getElementById('game-detail-view').classList.add('hidden');
            document.getElementById('home-btn').classList.remove('hidden');

            document.getElementById('cat-title').innerHTML = `<i class="fa-solid ${cat.icon} text-indigo-600"></i> ${cat.name}`;
            document.getElementById('cat-desc').innerText = cat.desc;

            // 渲染 3 個子遊戲
            const subGrid = document.getElementById('subgame-grid');
            subGrid.innerHTML = '';

            cat.games.forEach((game) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow border hover:border-indigo-300 transition p-6 flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="text-lg font-bold text-slate-800">${game.name}</h4>
                            <span class="text-xs px-2 py-1 bg-amber-50 text-amber-600 border border-amber-200 rounded">${game.diff}</span>
                        </div>
                        <p class="text-sm text-slate-600 mb-4">${game.desc}</p>
                    </div>
                    <button onclick="playGame('${game.id}')" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium text-sm transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-gamepad"></i> 進入試玩/說明
                    </button>
                `;
                subGrid.appendChild(card);
            });

            // 更新麵包屑
            document.getElementById('breadcrumb').innerHTML = `
                <span class="hover:text-indigo-600 cursor-pointer" onclick="showCategories()">首頁</span>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                <span class="font-semibold text-slate-800">${cat.name}</span>
            `;
        }

        // 返回當前分類
        function backToSubGames() {
            if(currentCatIndex !== null) {
                showSubGames(currentCatIndex);
            } else {
                showCategories();
            }
        }

        // 載入具體遊戲實體/示範
        function playGame(gameId) {
            const cat = puzzleData[currentCatIndex];
            const game = cat.games.find(g => g.id === gameId);
            currentGame = game;

            document.getElementById('category-view').classList.add('hidden');
            document.getElementById('subgame-view').classList.add('hidden');
            document.getElementById('game-detail-view').classList.remove('hidden');

            document.getElementById('game-cat-badge').innerText = cat.name;
            document.getElementById('game-title').innerText = game.name;
            document.getElementById('game-desc').innerText = game.desc;
            document.getElementById('game-rules').innerText = game.rules;
            document.getElementById('game-diff').innerText = game.diff;

            // 麵包屑
            document.getElementById('breadcrumb').innerHTML = `
                <span class="hover:text-indigo-600 cursor-pointer" onclick="showCategories()">首頁</span>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                <span class="hover:text-indigo-600 cursor-pointer" onclick="backToSubGames()">${cat.name}</span>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                <span class="font-semibold text-slate-800">${game.name}</span>
            `;

            // 動態載入簡易試玩模組
            loadPlaygroundModule(gameId);
        }

        // 簡易互動 Mini-Game 載入器
        function loadPlaygroundModule(gameId) {
            const playground = document.getElementById('game-playground');
            playground.innerHTML = ''; // 清空

            switch(gameId) {
                case 'bulls_cows': // 1A2B 遊戲
                    init1A2B(playground);
                    break;
                case 'card_match': // 翻牌記憶
                    initCardMatch(playground);
                    break;
                case 'monty_hall': // 三門問題
                    initMontyHall(playground);
                    break;
                default:
                    // 預設說明卡
                    playground.innerHTML = `
                        <div class="text-center p-6 space-y-3">
                            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                                <i class="fa-solid fa-cubes"></i>
                            </div>
                            <h4 class="text-lg font-bold text-slate-800">${currentGame.name} 互動模組</h4>
                            <p class="text-sm text-slate-500 max-w-md">本遊戲的核心概念為：「${currentGame.rules}」</p>
                            <button onclick="alert('提示：觀察規則並預先規劃步驟是通關關鍵！')" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm shadow hover:bg-indigo-700">獲得遊戲提示</button>
                        </div>
                    `;
            }
        }

        // --- 簡易 Demo 1: 1A2B 遊戲邏輯 ---
        function init1A2B(container) {
            // 產生 4 個不重複數字
            let secret = [];
            while(secret.length < 4){
                let r = Math.floor(Math.random() * 10);
                if(secret.indexOf(r) === -1) secret.push(r);
            }
            let secretStr = secret.join('');

            container.innerHTML = `
                <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-sm border text-center space-y-4">
                    <h4 class="font-bold text-slate-800">1A2B 猜數字小遊戲</h4>
                    <p class="text-xs text-slate-500">電腦已生成 4 位不重複數字，請輸入你的猜測：</p>
                    <div class="flex gap-2 justify-center">
                        <input type="text" id="input-1a2b" maxlength="4" placeholder="例如 1234" class="border px-3 py-2 rounded text-center font-mono text-lg w-32 focus:outline-indigo-500">
                        <button id="btn-1a2b" class="bg-indigo-600 text-white px-4 py-2 rounded font-medium hover:bg-indigo-700">猜測</button>
                    </div>
                    <div id="logs-1a2b" class="h-32 border rounded p-2 overflow-y-auto text-left font-mono text-xs space-y-1 bg-slate-50 custom-scrollbar">
                        <div class="text-slate-400">--- 開始猜測 ---</div>
                    </div>
                </div>
            `;

            document.getElementById('btn-1a2b').onclick = function() {
                const input = document.getElementById('input-1a2b').value;
                if(input.length !== 4 || isNaN(input)) {
                    alert('請输入 4 位純數字！');
                    return;
                }
                
                let a = 0, b = 0;
                for(let i=0; i<4; i++) {
                    if(input[i] === secretStr[i]) a++;
                    else if(secretStr.includes(input[i])) b++;
                }

                const log = document.getElementById('logs-1a2b');
                log.innerHTML = `<div>> ${input} ➔ <span class="font-bold text-indigo-600">${a}A${b}B</span></div>` + log.innerHTML;
                document.getElementById('input-1a2b').value = '';

                if(a === 4) {
                    alert('🎉 恭喜你答對了！答案就是 ' + secretStr);
                }
            };
        }

        // --- 簡易 Demo 2: 翻牌記憶遊戲 ---
        function initCardMatch(container) {
            const icons = ['🐶', '🐱', '🐭', '🐹', '🐶', '🐱', '🐭', '🐹'];
            // 隨機打亂
            icons.sort(() => Math.random() - 0.5);

            container.innerHTML = `
                <div class="text-center space-y-4">
                    <h4 class="font-bold text-slate-800">4x2 翻牌記憶體驗</h4>
                    <div class="grid grid-cols-4 gap-3 max-w-xs mx-auto" id="card-grid"></div>
                </div>
            `;

            const grid = document.getElementById('card-grid');
            let firstCard = null;
            let lock = false;

            icons.forEach((icon, i) => {
                const btn = document.createElement('button');
                btn.className = "w-14 h-14 bg-indigo-500 text-white font-bold text-xl rounded-lg shadow flex items-center justify-center transition";
                btn.dataset.icon = icon;
                btn.innerText = '?';

                btn.onclick = function() {
                    if(lock || btn.innerText !== '?') return;
                    btn.innerText = icon;
                    btn.classList.remove('bg-indigo-500');
                    btn.classList.add('bg-white', 'text-slate-800', 'border-2', 'border-indigo-500');

                    if(!firstCard) {
                        firstCard = btn;
                    } else {
                        if(firstCard.dataset.icon === icon) {
                            firstCard = null;
                        } else {
                            lock = true;
                            setTimeout(() => {
                                btn.innerText = '?';
                                btn.className = "w-14 h-14 bg-indigo-500 text-white font-bold text-xl rounded-lg shadow flex items-center justify-center transition";
                                firstCard.innerText = '?';
                                firstCard.className = "w-14 h-14 bg-indigo-500 text-white font-bold text-xl rounded-lg shadow flex items-center justify-center transition";
                                firstCard = null;
                                lock = false;
                            }, 800);
                        }
                    }
                };
                grid.appendChild(btn);
            });
        }

        // --- 簡易 Demo 3: 三門問題 ---
        function initMontyHall(container) {
            const carDoor = Math.floor(Math.random() * 3);
            
            container.innerHTML = `
                <div class="text-center space-y-4 max-w-md">
                    <h4 class="font-bold text-slate-800">三門問題 (Monty Hall Problem)</h4>
                    <p class="text-xs text-slate-500">三扇門後有一輛汽車與兩隻山羊，請選擇一扇門：</p>
                    <div class="flex gap-4 justify-center" id="doors-container">
                        <button onclick="chooseDoor(0, ${carDoor})" class="w-20 h-28 bg-amber-700 text-white font-bold rounded-lg shadow hover:bg-amber-800">門 1</button>
                        <button onclick="chooseDoor(1, ${carDoor})" class="w-20 h-28 bg-amber-700 text-white font-bold rounded-lg shadow hover:bg-amber-800">門 2</button>
                        <button onclick="chooseDoor(2, ${carDoor})" class="w-20 h-28 bg-amber-700 text-white font-bold rounded-lg shadow hover:bg-amber-800">門 3</button>
                    </div>
                    <div id="monty-msg" class="text-sm font-medium text-indigo-600 h-8"></div>
                </div>
            `;
        }

        function chooseDoor(chosen, car) {
            let hostOpen = [0, 1, 2].find(d => d !== chosen && d !== car);
            document.getElementById('monty-msg').innerText = `主持人為您開啟了門 ${hostOpen + 1}，後面是一隻山羊！數學上，此時「換門」獲得汽車的機率會提高至 2/3！`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水果時鐘 & 世界風景</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #111;
    }

    /* 背景圖層與 30 秒淡入淡出效果 */
    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: opacity 1.5s ease-in-out;
      opacity: 0;
      z-index: 1;
    }

    .bg-layer.active {
      opacity: 1;
    }

    /* 時鐘容器 */
    .clock-container {
      position: relative;
      width: min(80vw, 80vh);
      height: min(80vw, 80vh);
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      z-index: 2;
    }

    /* 中心點 */
    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      background: #333;
      border: 3px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    /* 水果刻度標籤 */
    .fruit-number {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      margin-top: -30px;
      margin-left: -30px;
      font-size: min(6vw, 6vh);
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.3));
    }

    /* 指針通用樣式 */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 10px;
      z-index: 5;
    }

    /* 時針 */
    .hour-hand {
      width: 10px;
      height: 25%;
      background: #222;
      margin-left: -5px;
    }

    /* 分針 */
    .minute-hand {
      width: 6px;
      height: 36%;
      background: #444;
      margin-left: -3px;
    }

    /* 秒針 */
    .second-hand {
      width: 3px;
      height: 42%;
      background: #e74c3c;
      margin-left: -1.5px;
    }
  </style>
</head>
<body>

  <!-- 雙層背景，實現無縫淡入淡出 */ -->
  <div id="bg1" class="bg-layer active"></div>
  <div id="bg2" class="bg-layer"></div>

  <!-- 超大水果時鐘 -->
  <div class="clock-container">
    <div class="center-dot"></div>
    
    <!-- 時鐘刻度點 (1-12 水果) -->
    <div id="fruits-container"></div>

    <!-- 指針 -->
    <div id="hour-hand" class="hand hour-hand"></div>
    <div id="minute-hand" class="hand minute-hand"></div>
    <div id="second-hand" class="hand second-hand"></div>
  </div>

  <script>
    // 1 至 12 點對應的水果 Emoji
    const fruits = [
      "🍎", // 1 點: 蘋果
      "🍐", // 2 點: 梨子
      "🍊", // 3 點: 橘子
      "🍋", // 4 點: 檸檬
      "🍌", // 5 點: 香蕉
      "🍉", // 6 點: 西瓜
      "🍇", // 7 點: 葡萄
      "🍓", // 8 點: 草莓
      "🍒", // 9 點: 櫻桃
      "🍑", // 10 點: 桃子
      "🍍", // 11 點: 鳳梨
      "🥝"  // 12 點: 奇異果
    ];

    // 世界風景圖片庫 (Unsplash 高畫質圖檔)
    const landscapeImages = [
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80", // 壯麗山脈
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80", // 熱帶海灘
      "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80", // 晨霧森林
      "https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1920&q=80", // 巴黎風光
      "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1920&q=80", // 日本京都
      "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80", // 星空雪山
      "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1920&q=80"  // 綠色草原
    ];

    // 1. 初始化水果時鐘刻度
    const fruitsContainer = document.getElementById("fruits-container");
    const containerRadius = 40; // 距離中心點的百分比距離 (%)

    fruits.forEach((fruit, index) => {
      const hourNum = index + 1;
      // 計算角度 (12點為0度/360度，每個小時增加 30 度)
      const angleDeg = hourNum * 30;
      const angleRad = (angleDeg - 90) * (Math.PI / 180);

      // 計算 X 與 Y 座標
      const x = 50 + containerRadius * Math.cos(angleRad);
      const y = 50 + containerRadius * Math.sin(angleRad);

      const fruitEl = document.createElement("div");
      fruitEl.className = "fruit-number";
      fruitEl.textContent = fruit;
      fruitEl.style.left = `${x}%`;
      fruitEl.style.top = `${y}%`;

      fruitsContainer.appendChild(fruitEl);
    });

    // 2. 時鐘更新邏輯
    const hourHand = document.getElementById("hour-hand");
    const minuteHand = document.getElementById("minute-hand");
    const secondHand = document.getElementById("second-hand");

    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secondsDegrees = (seconds / 60) * 360;
      const minutesDegrees = ((minutes + seconds / 60) / 60) * 360;
      const hoursDegrees = (((hours % 12) + minutes / 60) / 12) * 360;

      secondHand.style.transform = `rotate(${secondsDegrees}deg)`;
      minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;
      hourHand.style.transform = `rotate(${hoursDegrees}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock(); // 立即執行一次

    // 3. 背景自動切換邏輯 (每 30 秒換一張)
    let currentImageIndex = 0;
    let activeBgIndex = 1;
    const bg1 = document.getElementById("bg1");
    const bg2 = document.getElementById("bg2");

    // 初始化第一張圖
    bg1.style.backgroundImage = `url('${landscapeImages[0]}')`;

    function changeBackground() {
      currentImageIndex = (currentImageIndex + 1) % landscapeImages.length;
      const nextImageUrl = landscapeImages[currentImageIndex];

      if (activeBgIndex === 1) {
        bg2.style.backgroundImage = `url('${nextImageUrl}')`;
        bg2.classList.add("active");
        bg1.classList.remove("active");
        activeBgIndex = 2;
      } else {
        bg1.style.backgroundImage = `url('${nextImageUrl}')`;
        bg1.classList.add("active");
        bg2.classList.remove("active");
        activeBgIndex = 1;
      }
    }

    // 每 30,000 毫秒 (30 秒) 切換一次背景
    setInterval(changeBackground, 30000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全螢幕滿版水果餐刀時鐘 & 世界風景</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #000;
      user-select: none;
    }

    /* 背景圖層與 30 秒平滑淡入淡出 */
    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: opacity 1.5s ease-in-out;
      opacity: 0;
      z-index: 1;
    }

    .bg-layer.active {
      opacity: 1;
    }

    /* 滿版時鐘容器：100% 覆蓋整個視窗，底部完全透明 */
    .clock-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: transparent;
      border: none;
      box-shadow: none;
      z-index: 2;
    }

    /* 時鐘中心固定點 */
    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      background: #ffffff;
      border: 3px solid rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
    }

    /* 水果圖示元件 */
    .fruit-item {
      position: absolute;
      width: max(7vw, 7vh);
      height: max(7vw, 7vh);
      font-size: max(5.5vw, 5.5vh);
      display: flex;
      justify-content: center;
      align-items: center;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0px 6px 12px rgba(0, 0, 0, 0.8));
      z-index: 3;
    }

    /* 螢幕四周貼邊數字 (1-12) */
    .number-item {
      position: absolute;
      width: max(4.5vw, 4.5vh);
      height: max(4.5vw, 4.5vh);
      font-size: max(3.5vw, 3.5vh);
      font-weight: 900;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: translate(-50%, -50%);
      text-shadow: 0 3px 10px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.8);
      z-index: 4;
    }

    /* 餐刀指針 Container */
    .hand {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* SVG 刀子圖片的旋轉基準點 */
    .hand svg {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.7));
    }

    /* 時針 - 主餐刀 */
    .hour-hand svg {
      width: max(2.8vw, 2.8vh);
      height: calc(min(100vw, 100vh) * 0.28);
      margin-left: calc(-1 * max(1.4vw, 1.4vh));
    }

    /* 分針 - 牛排刀 */
    .minute-hand svg {
      width: max(2.4vw, 2.4vh);
      height: calc(min(100vw, 100vh) * 0.38);
      margin-left: calc(-1 * max(1.2vw, 1.2vh));
    }

    /* 秒針 - 紅色水果切刀 */
    .second-hand svg {
      width: max(1.8vw, 1.8vh);
      height: calc(min(100vw, 100vh) * 0.44);
      margin-left: calc(-1 * max(0.9vw, 0.9vh));
    }
  </style>
</head>
<body>

  <!-- 背景圖層 -->
  <div id="bg1" class="bg-layer active"></div>
  <div id="bg2" class="bg-layer"></div>

  <!-- 全螢幕滿版水果時鐘 -->
  <div class="clock-container">
    <div class="center-dot"></div>
    
    <!-- 水果與數字容器 -->
    <div id="dial-container"></div>

    <!-- 餐刀造型指針 -->
    <div id="hour-hand" class="hand hour-hand">
      <svg viewBox="0 0 30 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 11,200 L 19,200 L 19,100 L 21,90 C 23,70 23,30 15,0 C 13,30 11,70 11,100 Z" fill="url(#silverGrad)"/>
        <path d="M 11,200 L 19,200 L 19,120 L 11,120 Z" fill="#111111"/>
        <circle cx="15" cy="140" r="1.5" fill="#aaa"/>
        <circle cx="15" cy="170" r="1.5" fill="#aaa"/>
        <defs>
          <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#777777"/>
            <stop offset="35%" stop-color="#ffffff"/>
            <stop offset="65%" stop-color="#dddddd"/>
            <stop offset="100%" stop-color="#555555"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div id="minute-hand" class="hand minute-hand">
      <svg viewBox="0 0 24 260" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 9,260 L 15,260 L 15,110 L 17,95 C 19,65 19,25 12,0 C 10,25 9,65 9,110 Z" fill="url(#silverGrad2)"/>
        <path d="M 9,260 L 15,260 L 15,140 L 9,140 Z" fill="#222222"/>
        <circle cx="12" cy="160" r="1.2" fill="#bbb"/>
        <circle cx="12" cy="220" r="1.2" fill="#bbb"/>
        <defs>
          <linearGradient id="silverGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#888"/>
            <stop offset="40%" stop-color="#fff"/>
            <stop offset="100%" stop-color="#666"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div id="second-hand" class="hand second-hand">
      <svg viewBox="0 0 18 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 7,300 L 11,300 L 11,120 L 13,90 C 15,50 14,20 9,0 C 7,20 7,50 7,120 Z" fill="#ff3b30"/>
        <path d="M 7,300 L 11,300 L 11,180 L 7,180 Z" fill="#111111"/>
      </svg>
    </div>
  </div>

  <script>
    // 1-12 對應的水果 Emoji
    const fruits = [
      "🍎", "🍐", "🍊", "🍋", "🍌", "🍉",
      "🍇", "🍓", "🍒", "🍑", "🍍", "🥝"
    ];

    // 世界風景圖片庫
    const landscapeImages = [
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80",
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80",
      "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80",
      "https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1920&q=80",
      "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1920&q=80",
      "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80",
      "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1920&q=80"
    ];

    // 全螢幕邊界座標分佈（以 0% 到 100% 涵蓋整面螢幕）
    const edgePositions = {
      // 水果座標 (靠邊內側)
      fruit: {
        12: { x: 50, y: 14 },
        1:  { x: 88, y: 14 },
        2:  { x: 88, y: 32 },
        3:  { x: 88, y: 50 },
        4:  { x: 88, y: 68 },
        5:  { x: 88, y: 86 },
        6:  { x: 50, y: 86 },
        7:  { x: 12, y: 86 },
        8:  { x: 12, y: 68 },
        9:  { x: 12, y: 50 },
        10: { x: 12, y: 32 },
        11: { x: 12, y: 14 }
      },
      // 數字座標 (貼齊最外側邊界)
      number: {
        12: { x: 50, y: 4 },
        1:  { x: 96, y: 4 },
        2:  { x: 96, y: 27 },
        3:  { x: 96, y: 50 },
        4:  { x: 96, y: 73 },
        5:  { x: 96, y: 96 },
        6:  { x: 50, y: 96 },
        7:  { x: 4,  y: 96 },
        8:  { x: 4,  y: 73 },
        9:  { x: 4,  y: 50 },
        10: { x: 4,  y: 27 },
        11: { x: 4,  y: 4 }
      }
    };

    // 1. 動態繪製滿版水果與貼邊數字
    const dialContainer = document.getElementById("dial-container");

    fruits.forEach((fruit, index) => {
      const hourNum = index + 1;
      
      // 水果元件
      const fPos = edgePositions.fruit[hourNum];
      const fruitEl = document.createElement("div");
      fruitEl.className = "fruit-item";
      fruitEl.textContent = fruit;
      fruitEl.style.left = `${fPos.x}%`;
      fruitEl.style.top = `${fPos.y}%`;
      dialContainer.appendChild(fruitEl);

      // 外側貼邊數字元件
      const nPos = edgePositions.number[hourNum];
      const numEl = document.createElement("div");
      numEl.className = "number-item";
      numEl.textContent = hourNum;
      numEl.style.left = `${nPos.x}%`;
      numEl.style.top = `${nPos.y}%`;
      dialContainer.appendChild(numEl);
    });

    // 2. 時鐘運作與旋轉計算
    const hourHandSvg = document.querySelector("#hour-hand svg");
    const minuteHandSvg = document.querySelector("#minute-hand svg");
    const secondHandSvg = document.querySelector("#second-hand svg");

    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secondsDeg = (seconds / 60) * 360;
      const minutesDeg = ((minutes + seconds / 60) / 60) * 360;
      const hoursDeg = (((hours % 12) + minutes / 60) / 12) * 360;

      secondHandSvg.style.transform = `rotate(${secondsDeg}deg)`;
      minuteHandSvg.style.transform = `rotate(${minutesDeg}deg)`;
      hourHandSvg.style.transform = `rotate(${hoursDeg}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // 3. 背景 30 秒自動切換 (平滑淡入淡出)
    let currentImageIndex = 0;
    let activeBgIndex = 1;
    const bg1 = document.getElementById("bg1");
    const bg2 = document.getElementById("bg2");

    bg1.style.backgroundImage = `url('${landscapeImages[0]}')`;

    function changeBackground() {
      currentImageIndex = (currentImageIndex + 1) % landscapeImages.length;
      const nextImageUrl = landscapeImages[currentImageIndex];

      if (activeBgIndex === 1) {
        bg2.style.backgroundImage = `url('${nextImageUrl}')`;
        bg2.classList.add("active");
        bg1.classList.remove("active");
        activeBgIndex = 2;
      } else {
        bg1.style.backgroundImage = `url('${nextImageUrl}')`;
        bg1.classList.add("active");
        bg2.classList.remove("active");
        activeBgIndex = 1;
      }
    }

    setInterval(changeBackground, 30000);
  </script>
</body>
</html>

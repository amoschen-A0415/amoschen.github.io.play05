<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安得烈食物銀行 知識大冒險 🍄</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mario: {
                            red: '#E52521',
                            green: '#43B047',
                            yellow: '#FBD000',
                            blue: '#00247D',
                            sky: '#5C94FC',
                            brick: '#B84418',
                            brown: '#8C5220',
                            cream: '#FCE1AC'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@800;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #5C94FC;
            color: #222;
            user-select: none;
            overflow: hidden;
        }

        .cloud-bg {
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 20%),
                radial-gradient(circle at 80% 30%, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 25%);
        }

        .mario-card {
            background-color: #FCE1AC;
            border: 4px solid #8C5220;
            box-shadow: 4px 6px 0px #42210B;
        }

        .mario-btn-red {
            background-color: #E52521;
            border: 4px solid #8A0F0D;
            box-shadow: 0px 6px 0px #520807;
            color: white;
        }
        .mario-btn-red:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px #520807;
        }

        .mario-btn-green {
            background-color: #43B047;
            border: 4px solid #206223;
            box-shadow: 0px 6px 0px #113B13;
            color: white;
        }
        .mario-btn-green:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px #113B13;
        }

        .mario-btn-yellow {
            background-color: #FBD000;
            border: 4px solid #A08300;
            box-shadow: 0px 6px 0px #635100;
            color: #42210B;
        }
        .mario-btn-yellow:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px #635100;
        }

        .mario-btn-blue {
            background-color: #00247D;
            border: 4px solid #001242;
            box-shadow: 0px 6px 0px #000924;
            color: white;
        }
        .mario-btn-blue:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px #000924;
        }

        /* 答案閃爍與彈跳膨脹脈動動畫 */
        @keyframes correct-flash-pop {
            0%, 100% { 
                background-color: #FBD000; 
                color: #000; 
                transform: scale(1.02);
                box-shadow: 0 0 25px #FBD000;
            }
            50% { 
                background-color: #43B047; 
                color: #FFF; 
                transform: scale(1.12);
                box-shadow: 0 0 50px #43B047;
            }
        }
        .animate-correct-flash {
            animation: correct-flash-pop 0.45s ease-in-out infinite;
            z-index: 30;
        }

        /* 巨型數字爆發漸淡動畫 */
        @keyframes mega-number-fade {
            0% { 
                transform: scale(0.5); 
                opacity: 1; 
            }
            35% { 
                transform: scale(1.15); 
                opacity: 0.95; 
            }
            100% { 
                transform: scale(1.85); 
                opacity: 0; 
            }
        }
        .animate-mega-fade {
            animation: mega-number-fade 0.95s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
        }

        /* 動物圖案掉落動畫 */
        @keyframes animal-drop {
            0% {
                transform: translateY(-20vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 1; }
            100% {
                transform: translateY(105vh) scale(1.4) rotate(360deg);
                opacity: 0.8;
            }
        }
        .dropping-animal {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            animation: animal-drop 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        #qrcode canvas, #qrcode img {
            margin: 0 auto;
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden cloud-bg">

    <!-- 頂部標題列 -->
    <header id="main-header" class="w-full px-6 py-3 bg-mario-red border-b-8 border-mario-brown text-white flex justify-between items-center z-10 flex-shrink-0 shadow-lg">
        <div class="flex items-center space-x-3">
            <span class="text-4xl animate-bounce">🍄</span>
            <h1 class="text-2xl md:text-3xl font-black tracking-wider drop-shadow-[0_3px_0_#8A0F0D]">
                安得烈食物銀行 知識大冒險 ✨
            </h1>
        </div>
        <div id="game-stage-badge" class="px-5 py-1.5 rounded-full text-base md:text-xl font-black bg-mario-yellow text-mario-brown border-4 border-mario-brown shadow">
            🌟 準備開考！
        </div>
    </header>

    <!-- 定向動物掉落容器 -->
    <div id="animal-canvas-left" class="fixed top-0 left-0 w-1/2 h-full pointer-events-none z-50 overflow-hidden"></div>
    <div id="animal-canvas-right" class="fixed top-0 right-0 w-1/2 h-full pointer-events-none z-50 overflow-hidden"></div>

    <!-- 倒數數字遮罩 -->
    <div id="overlay-countdown" class="hidden fixed inset-0 z-50 bg-black/10 flex items-center justify-center backdrop-blur-[1px] pointer-events-none overflow-hidden">
        <span id="overlay-big-number" class="text-[32rem] md:text-[45rem] font-black text-mario-red drop-shadow-[0_20px_0_#FBD000] z-50 leading-none">
            5
        </span>
    </div>

    <!-- 主要內容區 -->
    <main class="flex-grow flex items-center justify-center p-3 md:p-5 relative overflow-hidden">

        <!-- 大螢幕 - 控制器待機畫面 -->
        <div id="view-lobby" class="w-full max-w-[96vw] h-full max-h-[88vh] mario-card rounded-3xl p-6 shadow-2xl relative flex flex-col justify-between overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center h-full">
                
                <!-- 左半邊：主控手機專用 QR Code 區 -->
                <div class="md:col-span-5 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r-4 border-mario-brown pr-0 md:pr-6 text-center h-full">
                    
                    <div id="host-qr-box" class="flex flex-col items-center justify-center">
                        <div class="p-4 bg-mario-yellow rounded-3xl border-4 border-mario-brown shadow-xl my-2">
                            <div id="qrcode" class="bg-white p-3 rounded-2xl border-2 border-mario-brown"></div>
                        </div>
                        <h2 class="text-2xl md:text-3xl font-black text-mario-red mt-2 flex items-center gap-2">
                            <span>📱 請用「主控手機」掃碼</span>
                        </h2>
                        <p class="text-base font-bold text-mario-brown bg-white/80 px-4 py-1.5 rounded-xl border-2 border-mario-brown shadow mt-1">
                            掃描上方 QR Code 開啟遊戲控制器
                        </p>
                    </div>

                    <div id="host-connected-box" class="hidden flex-col items-center justify-center py-8">
                        <div class="text-8xl mb-4 animate-bounce">🟢</div>
                        <h2 class="text-3xl font-black text-mario-green">主控制器已連線！</h2>
                        <p class="text-xl font-bold text-mario-brown bg-white/80 px-6 py-3 rounded-2xl border-2 border-mario-brown shadow mt-3">
                            請在主控手機上點擊「開始遊戲」
                        </p>
                    </div>

                </div>

                <!-- 右半邊：隨機產生的重點提醒 -->
                <div class="md:col-span-7 flex flex-col justify-between h-full overflow-hidden pl-0 md:pl-2">
                    <div class="flex-grow flex flex-col overflow-hidden">
                        <h2 class="text-3xl md:text-4xl font-black text-mario-blue mb-4 flex items-center gap-2 border-b-4 border-mario-brown pb-2">
                            <span>💡 安得烈愛心知識小補帖</span>
                        </h2>

                        <div id="random-tips-container" class="grid grid-cols-1 gap-4 overflow-y-auto max-h-[62vh] pr-2 text-slate-900 font-bold">
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 手機端 - 唯一主控制器 -->
        <div id="view-host-controller" class="hidden fixed inset-0 z-50 bg-mario-blue p-4 flex-col justify-between overflow-hidden">
            <div class="bg-white/90 p-3 rounded-2xl border-4 border-mario-brown flex justify-between items-center shadow-lg">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">👑</span>
                    <span class="font-black text-mario-blue text-lg">主控制器面板</span>
                </div>
                <div class="flex items-center gap-2 bg-mario-cream px-3 py-1.5 rounded-xl border-2 border-mario-brown">
                    <span class="text-xl">🔊</span>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.3" class="w-20 md:w-28 accent-mario-red cursor-pointer">
                    <span id="volume-text" class="text-xs font-black text-mario-brown w-8">30%</span>
                </div>
            </div>

            <!-- 紅綠互動按鈕 -->
            <div class="grid grid-cols-2 gap-3 my-2 bg-white/20 p-2.5 rounded-2xl border-2 border-white/40">
                <button onclick="triggerAnimals('red')" class="mario-btn-red py-3.5 rounded-xl font-black text-lg flex items-center justify-center gap-2 shadow-lg">
                    <span>🔴</span> 紅區動物雨
                </button>
                <button onclick="triggerAnimals('green')" class="mario-btn-green py-3.5 rounded-xl font-black text-lg flex items-center justify-center gap-2 shadow-lg">
                    <span>🟢</span> 綠區動物雨
                </button>
            </div>

            <!-- 控制器四大面板按鈕 -->
            <div class="grid grid-cols-1 gap-3 my-auto w-full max-w-md mx-auto">
                <button id="ctrl-btn-start" onclick="controllerStartGame()" class="mario-btn-green py-4 text-2xl font-black rounded-2xl flex items-center justify-center gap-3">
                    <i class="fa-solid fa-play"></i> 🎮 開始遊戲
                </button>

                <button id="ctrl-btn-next" onclick="controllerNextQuestion()" disabled class="mario-btn-yellow py-4 text-2xl font-black rounded-2xl flex items-center justify-center gap-3 opacity-50 cursor-not-allowed">
                    <i class="fa-solid fa-forward"></i> ➡️ 下一題
                </button>

                <button id="ctrl-btn-countdown" onclick="controllerStartCountdown()" disabled class="mario-btn-blue py-4 text-2xl font-black rounded-2xl flex items-center justify-center gap-3 opacity-50 cursor-not-allowed">
                    <i class="fa-solid fa-stopwatch"></i> ⏱️ 倒數 5 秒
                </button>

                <button id="ctrl-btn-end" onclick="controllerEndGame()" class="mario-btn-red py-3.5 text-xl font-black rounded-2xl flex items-center justify-center gap-3">
                    <i class="fa-solid fa-power-off"></i> 🛑 結束遊戲
                </button>
            </div>

            <div id="ctrl-status-text" class="text-center font-black text-white bg-black/40 p-2 rounded-xl text-sm">
                連線成功！請點擊「開始遊戲」啟動冒險！
            </div>
        </div>

        <!-- 防呆確認彈窗 -->
        <div id="modal-confirm-end" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
            <div class="mario-card p-6 rounded-3xl max-w-sm w-full text-center space-y-4">
                <span class="text-6xl animate-bounce">⚠️</span>
                <h3 class="text-2xl font-black text-mario-red">防呆確認</h3>
                <p class="text-lg font-bold text-slate-800">您確定要立刻結束遊戲嗎？<br>將會直接進行 TOP 3 精典回顧喔！</p>
                <div class="flex gap-3 pt-2">
                    <button onclick="confirmEndGame(false)" class="w-1/2 py-3 bg-slate-400 border-2 border-slate-700 text-white font-black rounded-xl text-lg">取消</button>
                    <button onclick="confirmEndGame(true)" class="w-1/2 mario-btn-red py-3 font-black rounded-xl text-lg">確定結束</button>
                </div>
            </div>
        </div>

        <!-- 大螢幕 - 遊戲主畫面 -->
        <div id="view-game" class="hidden w-full h-full max-h-[92vh] flex flex-col justify-between relative overflow-hidden gap-4">
            
            <!-- 本次優化：題目區域（內距加大，字體微縮 8%，絕不碰框） -->
            <div class="h-[32%] w-full bg-white border-8 border-mario-brown rounded-3xl p-5 md:p-8 shadow-xl flex flex-col justify-between relative overflow-hidden flex-shrink-0">
                <div class="flex justify-between items-center border-b-4 border-slate-200 pb-1">
                    <span id="question-number" class="text-mario-blue font-black text-2xl md:text-3xl">🌟 第 1 題</span>
                    <span class="text-mario-brown font-black text-lg md:text-xl">安得烈知識大冒險</span>
                </div>
                <div class="flex-grow flex items-center justify-center text-center py-1 px-4 overflow-hidden">
                    <h2 id="question-text" class="text-3xl md:text-5xl lg:text-6xl font-black text-slate-900 leading-snug whitespace-pre-line tracking-wide max-w-[95%] max-h-[90%] flex items-center justify-center">
                        題目載入中...
                    </h2>
                </div>
            </div>

            <!-- 答案區域 -->
            <div class="h-[66%] w-full grid grid-cols-2 gap-6 flex-grow">
                <!-- 左邊：紅底答案 -->
                <div id="option-btn-0" class="h-full bg-mario-red border-8 border-mario-brown rounded-3xl p-6 md:p-8 shadow-2xl flex items-center justify-center text-white text-center transition-all duration-300 overflow-hidden">
                    <span id="option-text-0" class="text-5xl md:text-6xl lg:text-7xl font-black leading-tight drop-shadow-[0_8px_0_#520807] max-w-[90%] max-h-[90%] flex flex-col items-center justify-center whitespace-pre-line break-words tracking-normal">
                        選項一內容
                    </span>
                </div>

                <!-- 右邊：綠底答案 -->
                <div id="option-btn-1" class="h-full bg-mario-green border-8 border-mario-brown rounded-3xl p-6 md:p-8 shadow-2xl flex items-center justify-center text-white text-center transition-all duration-300 overflow-hidden">
                    <span id="option-text-1" class="text-5xl md:text-6xl lg:text-7xl font-black leading-tight drop-shadow-[0_8px_0_#113B13] max-w-[90%] max-h-[90%] flex flex-col items-center justify-center whitespace-pre-line break-words tracking-normal">
                        選項二內容
                    </span>
                </div>
            </div>

        </div>

        <!-- 大螢幕 - 精典回顧 -->
        <div id="view-review" class="hidden w-full max-w-[96vw] h-full max-h-[90vh] mario-card rounded-3xl p-4 md:p-6 shadow-2xl flex flex-col justify-between overflow-hidden">
            <div class="text-center border-b-4 border-mario-brown pb-2 flex-shrink-0">
                <div class="flex items-center justify-center gap-3">
                    <span class="text-4xl animate-bounce">⭐</span>
                    <h2 class="text-3xl md:text-5xl font-black text-mario-red">精典回顧 TOP 3</h2>
                </div>
                <p class="text-lg md:text-xl font-black text-mario-brown mt-0.5">這 3 題是大家思考最久的精華題目喔！一起記憶複習吧！</p>
            </div>

            <div id="review-list-container" class="flex-grow flex flex-col justify-between my-2 space-y-3 overflow-hidden">
            </div>
        </div>

    </main>

    <!-- 背景音樂 Audio -->
    <audio id="bgm-player" loop preload="auto">
        <source src="Two_Coins_Left.mp3" type="audio/mpeg">
    </audio>

    <script>
        const raw50QuizDatabase = [
            { question: "本協會的正確名稱為何？", options: ["社團法人中華安德烈慈善協會", "社團法人中華安得烈慈善協會", "財團法人安德烈食物銀行", "社團法人安得路慈善協會"], answer: 1 },
            { question: "安得烈慈善協會的英文名稱是？", options: ["ANDREW Charity Association", "ANDRE Charity Association", "ANDREW Food Bank", "ANDREW Love Association"], answer: 0 },
            { question: "安得烈慈善協會的 Logo 標誌中，不包含下列哪一個元素圖案？", options: ["麥穗", "愛心", "魚", "飛鷹"], answer: 3 },
            { question: "安得烈食物銀行紙箱上印製的吉祥祝福語是？", options: ["祝您 豐衣足食 萬事如意", "祝您 食來運轉 平安得福", "祝您 健康平安 永保安康", "祝您 迎春納福 吃飽穿暖"], answer: 1 },
            { question: "下列何者不是安得烈慈善協會的核心工作項目？", options: ["食物銀行計畫 / 急難救助", "弱勢扶助培鷹計畫 / 災害援助", "教育推廣（善果計畫）", "海外移民留學輔導"], answer: 3 },
            { question: "針對「初生至 3 歲」的嬰兒，安得烈提供哪一種專案物資箱？", options: ["膳糧食物箱", "嬰兒物資箱", "松柏食物箱", "長青食物箱"], answer: 1 },
            { question: "針對「3 歲至 15 歲」需要幫助的兒少，安得烈主要提供哪一種食物箱？", options: ["嬰兒物資箱", "膳糧食物箱", "松柏食物箱", "安心食物箱"], answer: 1 },
            { question: "「松柏食物箱」主要服務的對象年齡層為？", options: ["65 歲至 80 歲需要幫助的長者", "80 歲以上需要幫助的長者", "50 歲至 65 歲需要幫助的長者", "100 歲以上人瑞"], answer: 1 },
            { question: "「長青食物箱」主要提供給哪一個年齡層需要幫助的長者？", options: ["55 至 65 歲", "65 至 80 歲", "80 歲以上", "全年齡層通用"], answer: 1 },
            { question: "針對重病或罕見疾病者等特殊飲食需求者，安得烈可提供下列哪種膳糧食物箱？", options: ["專案物資箱", "低糖無鹽食物箱", "生酮飲食食物箱", "全海鮮食物箱"], answer: 0 },
            { question: "為了幫助需要幫助的家庭過好年，安得烈會在歲末節慶推出什麼特色食物箱？", options: ["中秋月餅箱", "年菜食物箱", "端午粽子箱", "尾牙禮盒箱"], answer: 1 },
            { question: "安得烈引導需要幫助家庭的孩子適性發展、鼓勵完成學業或培育技能的計畫稱為？", options: ["育鷹計畫", "培鷹計畫", "飛鷹計畫", "雄鷹計畫"], answer: 1 },
            { question: "安得烈為增進需要幫助的兒少藝文創作能力所舉辦的全國學藝競賽，不包含下列哪一項目？", options: ["作文", "繪畫", "書法", "朗讀"], answer: 3 },
            { question: "安得烈每年暑假針對「國小、國中」梯次學童舉辦的營隊名稱為？", options: ["飛颺營", "生命成長營", "探索冒險營", "快樂學習營"], answer: 1 },
            { question: "安得烈每年暑假針對「高中、大學」梯次學生舉辦的營隊名稱為？", options: ["飛颺營", "領袖培訓營", "生命成長營", "青苗成長營"], answer: 0 },
            { question: "安得烈營隊活動的四大發展目標，不包含下列哪一項？", options: ["品格成長", "知識成長", "財富成長", "視野成長 / 實力成長"], answer: 2 },
            { question: "安得烈提供獎(助)學金鼓勵學生完成學業，同時鼓勵他們參與什麼活動以回饋社會？", options: ["服務學習", "企業實習", "環保淨灘", "海外留學"], answer: 0 },
            { question: "因應技職教育發展，安得烈推動何種方案培育清寒需要幫助的學生的技能專長？", options: ["百年樹人方案", "希望工程方案", "職人造樹方案", "築夢踏實方案"], answer: 1 },

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function playDropSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                const startFreq = 220 + Math.random() * 300;
                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(startFreq * 2.5, audioCtx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e) {}
        }

        function formatQuestionText(text) {
            if (text.includes('\n')) return text;

            if (text.includes('，')) return text.replace('，', '，\n');
            if (text.includes('？')) return text.replace('？', '？\n');
            if (text.includes(' / ')) return text.replace(' / ', '\n/ ');
            if (text.includes(' (')) return text.replace(' (', '\n(');

            const mid = Math.floor(text.length / 2);
            let splitPos = mid;

            const keywords = ["安得烈", "食物銀行", "慈善協會", "食物箱", "培鷹計畫", "善果計畫"];
            for (let kw of keywords) {
                let kwIdx = text.indexOf(kw);
                if (kwIdx !== -1 && Math.abs(kwIdx - mid) < 5) {
                    splitPos = kwIdx;
                    break;
                }
            }

            return text.slice(0, splitPos) + '\n' + text.slice(splitPos);
        }

        function formatOptionText(text) {
            text = sanitizeOptionText(text);
            if (text.includes('\n')) return text;

            if (text.includes(' ')) return text.replace(' ', '\n');
            if (text.includes('/')) return text.replace('/', '\n/ ');

            const mid = Math.ceil(text.length / 2);
            return text.slice(0, mid) + '\n' + text.slice(mid);
        }

        function convert4To2Options(item) {
            const correctText = item.options[item.answer];
            const wrongOptions = item.options.filter((_, idx) => idx !== item.answer);
            const randomWrongText = wrongOptions[Math.floor(Math.random() * wrongOptions.length)];

            const isCorrectOnLeft = Math.random() < 0.5;
            const twoOpts = isCorrectOnLeft ? [correctText, randomWrongText] : [randomWrongText, correctText];
            const newAnswerIndex = isCorrectOnLeft ? 0 : 1;

            return {
                question: formatQuestionText(item.question),
                options: twoOpts.map(formatOptionText),
                answer: newAnswerIndex
            };
        }

        function handleControllerCommand(data) {
            if (data.type === 'START_GAME') {
                playBgm();
                startGame();
            } else if (data.type === 'NEXT_QUESTION') {
                nextQuestion();
            } else if (data.type === 'START_COUNTDOWN') {
                start5SecCountdown();
            } else if (data.type === 'END_GAME') {
                endGameAndShowReview();
            } else if (data.type === 'SET_VOLUME') {
                bgm.volume = data.volume;
            } else if (data.type === 'TRIGGER_ANIMALS') {
                spawnFloatingAnimals(data.color);
            }
        }

        function clearAnswerEffects() {
            if (countdownInterval) clearInterval(countdownInterval);
            
            const overlay = document.getElementById('overlay-countdown');
            overlay.classList.add('hidden');

            for (let i = 0; i <= 1; i++) {
                const btn = document.getElementById(`option-btn-${i}`);

            }

            if (navigator.vibrate) navigator.vibrate(0);

        function loadQuestion(index) {
            clearAnswerEffects();

            if (index >= quizDatabase.length) {
                endGameAndShowReview();
                return;
            }

            const qData = convert4To2Options(quizDatabase[index]);
            currentCorrectIndex = qData.answer;

            document.getElementById('question-number').innerText = `🌟 第 ${index + 1} 題`;
            document.getElementById('question-text').innerText = qData.question;

            document.getElementById('option-text-0').innerText = qData.options[0];
            document.getElementById('option-text-1').innerText = qData.options[1];

            questionStartTime = Date.now();
            quizDatabase[index]._current2Data = qData;
        }

        function nextQuestion() {
            if (questionStartTime > 0 && currentQuestionIndex < quizDatabase.length) {
                const duration = (Date.now() - questionStartTime) / 1000;
                questionTimeLog.push({
                    questionIndex: currentQuestionIndex,
                    rawQuestionData: quizDatabase[currentQuestionIndex],
                    current2Data: quizDatabase[currentQuestionIndex]._current2Data,
                    duration: duration
                });
            }

            currentQuestionIndex++;
            loadQuestion(currentQuestionIndex);
        }

        function start5SecCountdown() {
            clearAnswerEffects();

            const overlay = document.getElementById('overlay-countdown');
            const bigNum = document.getElementById('overlay-big-number');
            overlay.classList.remove('hidden');

            let count = 5;
            bigNum.innerText = count;

            bigNum.classList.remove('animate-mega-fade');
            void bigNum.offsetWidth;
            bigNum.classList.add('animate-mega-fade');

            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    bigNum.innerText = count;
                    bigNum.classList.remove('animate-mega-fade');
                    void bigNum.offsetWidth; 
                    bigNum.classList.add('animate-mega-fade');
                } else {
                    clearInterval(countdownInterval);
                    
                    overlay.classList.add('hidden');

                    const correctBtn = document.getElementById(`option-btn-${currentCorrectIndex}`);
                    correctBtn.classList.add('animate-correct-flash', 'ring-8', 'ring-mario-yellow');

                    if (navigator.vibrate) {
                        navigator.vibrate([300, 100, 300, 100, 500]);
                    }

                    if (hostConn && hostConn.open) {
                        hostConn.send({ type: 'COUNTDOWN_FINISHED' });
                    }
                }
            }, 1000);
        }

        function startBgmFadeOut() {
            if (fadeOutInterval) clearInterval(fadeOutInterval);
            
            fadeOutInterval = setInterval(() => {
                if (bgm.volume > 0.01) {
                    bgm.volume = Math.max(0, bgm.volume - 0.01);
                    const slider = document.getElementById('volume-slider');
                    const volText = document.getElementById('volume-text');
                    if (slider && volText) {
                        slider.value = bgm.volume;
                        volText.innerText = Math.round(bgm.volume * 100) + '%';
                    }
                } else {
                    bgm.volume = 0;
                    bgm.pause();
                    clearInterval(fadeOutInterval);
                }
            }, 1000);
        }

        function endGameAndShowReview() {
            clearAnswerEffects();

            if (questionStartTime > 0 && currentQuestionIndex < quizDatabase.length) {
                const duration = (Date.now() - questionStartTime) / 1000;
                questionTimeLog.push({
                    questionIndex: currentQuestionIndex,
                    rawQuestionData: quizDatabase[currentQuestionIndex],
                    current2Data: quizDatabase[currentQuestionIndex]._current2Data,
                    duration: duration
                });
            }

            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('view-review').classList.remove('hidden');

            startBgmFadeOut();

            const sortedByTime = [...questionTimeLog].sort((a, b) => b.duration - a.duration).slice(0, 3);

            const container = document.getElementById('review-list-container');
            container.innerHTML = '';

            if (sortedByTime.length === 0) {
                container.innerHTML = `<div class="text-center font-bold text-slate-500 py-8 text-2xl">尚無足夠的題目測試紀錄！</div>`;
                return;
            }

            sortedByTime.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'bg-white p-3 md:p-4 rounded-3xl border-4 border-mario-brown shadow-lg flex items-center justify-between gap-4 h-[31%] overflow-hidden';
                
                const rawQ = item.rawQuestionData;
                const rawCorrectAnsText = rawQ.options[rawQ.answer];
                const correctAnsText = sanitizeOptionText(rawCorrectAnsText);

                card.innerHTML = `
                    <div class="flex items-center gap-3 md:gap-4 overflow-hidden">
                        <span class="text-xl md:text-3xl font-black bg-mario-yellow text-mario-brown px-3 py-1.5 rounded-2xl border-4 border-mario-brown flex-shrink-0">
                            TOP ${idx + 1}
                        </span>
                        <div class="text-left overflow-hidden">
                            <h4 class="text-2xl md:text-3xl lg:text-4xl font-black text-slate-900 leading-snug whitespace-pre-line break-words">${rawQ.question}</h4>
                            <p class="text-xl md:text-2xl font-black text-mario-green mt-0.5 whitespace-pre-line break-words">✅ 正確答案：${correctAnsText}</p>
                        </div>
                    </div>
                    <div class="bg-mario-cream px-3 py-1.5 rounded-2xl border-2 border-mario-brown font-black text-mario-brown text-base md:text-lg flex-shrink-0">
                        ⏱️ 停留：${item.duration.toFixed(1)} 秒
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>

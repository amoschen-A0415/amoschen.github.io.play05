<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安得烈食物銀行知識大亂鬥 - 動物音量賽跑</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS & QRCode.js -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            blue: '#00f3ff',
                            purple: '#b000ff',
                            pink: '#ff007f',
                            green: '#00ff66',
                            yellow: '#ffcc00'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            user-select: none;
            overflow: hidden;
        }

        #qrcode canvas, #qrcode img {
            margin: 0 auto;
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* 跑道與動物平滑移動效果 */
        .animal-racer {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-purple-950 to-slate-950">

    <!-- 頂部 Header -->
    <header id="main-header" class="w-full px-6 py-3 border-b border-slate-800 bg-slate-900/60 backdrop-blur-md flex justify-between items-center z-10 flex-shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🍞</span>
            <h1 class="text-2xl md:text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-neon-blue via-neon-purple to-neon-pink">
                安得烈食物銀行知識大亂鬥 - 動物大喊向前衝
            </h1>
        </div>
    </header>

    <!-- 主要內容區域 -->
    <main class="flex-grow flex items-center justify-center p-4 relative overflow-hidden">

        <!-- 大螢幕 - 賽跑與 QR Code 進入畫面 -->
        <div id="view-lobby" class="w-full max-w-[96vw] h-full max-h-[90vh] bg-slate-900/80 border-2 border-slate-700/80 rounded-2xl p-6 shadow-2xl backdrop-blur-xl relative flex flex-col justify-between overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center h-full">
                
                <!-- 左側：QR Code -->
                <div class="md:col-span-4 flex flex-col items-center justify-center border-r border-slate-700/80 pr-6 h-full">
                    <h2 class="text-xl font-bold text-neon-blue mb-2">📱 請用手機掃碼連線</h2>
                    <div class="p-4 bg-gradient-to-br from-cyan-400 via-purple-500 to-pink-500 rounded-2xl shadow-[0_0_50px_rgba(0,243,255,0.4)] my-auto">
                        <div id="qrcode" class="bg-white p-3 rounded-xl flex items-center justify-center shadow-inner"></div>
                    </div>
                    <p class="text-xs text-slate-400 mt-3">連線後點擊動物並大聲喊叫即可前進！</p>
                </div>

                <!-- 右側：4條動物賽道 (大螢幕) -->
                <div class="md:col-span-8 flex flex-col justify-center h-full space-y-4 px-2">
                    <h2 class="text-2xl font-black text-neon-yellow flex items-center gap-2 mb-2">
                        <span>🏁</span> 動物競技場 (實時位移)
                    </h2>

                    <div id="race-tracks" class="space-y-3 w-full bg-slate-950/80 p-4 rounded-2xl border border-slate-800">
                        <!-- 動物 0: 獅子 -->
                        <div class="relative w-full bg-slate-900 border border-slate-800 rounded-xl p-2 h-16 flex items-center overflow-hidden">
                            <div class="absolute right-3 text-slate-600 font-black text-sm z-0">終點 🏁</div>
                            <div id="track-animal-0" class="animal-racer relative z-10 flex items-center gap-2 text-4xl" style="transform: translateX(0px);">
                                🦁 <span class="text-xs text-neon-blue font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">獅子 (0px)</span>
                            </div>
                        </div>

                        <!-- 動物 1: 兔子 -->
                        <div class="relative w-full bg-slate-900 border border-slate-800 rounded-xl p-2 h-16 flex items-center overflow-hidden">
                            <div class="absolute right-3 text-slate-600 font-black text-sm z-0">終點 🏁</div>
                            <div id="track-animal-1" class="animal-racer relative z-10 flex items-center gap-2 text-4xl" style="transform: translateX(0px);">
                                🐰 <span class="text-xs text-neon-pink font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">兔子 (0px)</span>
                            </div>
                        </div>

                        <!-- 動物 2: 猴子 -->
                        <div class="relative w-full bg-slate-900 border border-slate-800 rounded-xl p-2 h-16 flex items-center overflow-hidden">
                            <div class="absolute right-3 text-slate-600 font-black text-sm z-0">終點 🏁</div>
                            <div id="track-animal-2" class="animal-racer relative z-10 flex items-center gap-2 text-4xl" style="transform: translateX(0px);">
                                🐵 <span class="text-xs text-neon-yellow font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">猴子 (0px)</span>
                            </div>
                        </div>

                        <!-- 動物 3: 大象 -->
                        <div class="relative w-full bg-slate-900 border border-slate-800 rounded-xl p-2 h-16 flex items-center overflow-hidden">
                            <div class="absolute right-3 text-slate-600 font-black text-sm z-0">終點 🏁</div>
                            <div id="track-animal-3" class="animal-racer relative z-10 flex items-center gap-2 text-4xl" style="transform: translateX(0px);">
                                🐘 <span class="text-xs text-neon-green font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">大象 (0px)</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 手機端 - 控制器/聲音判定 -->
        <div id="view-player-mobile" class="hidden fixed inset-0 z-50 bg-slate-950 p-4 flex-col justify-between overflow-hidden">
            <div class="text-center space-y-1 flex-shrink-0">
                <span class="text-3xl">🍞</span>
                <h2 class="text-2xl font-black text-neon-blue">動物音量控制器</h2>
                <p id="mobile-status-text" class="text-neon-yellow font-bold text-sm">請選擇一隻動物開始喊叫推進！</p>
            </div>

            <!-- 手機 4 個動物選擇圖示區 -->
            <div id="mobile-animals-grid" class="grid grid-cols-2 gap-4 w-full my-auto p-2">
                <button onclick="selectAnimalAndListen(0)" class="animal-btn bg-slate-900 hover:bg-slate-800 border-2 border-blue-500 rounded-2xl p-6 flex flex-col items-center justify-center space-y-2 active:scale-95 transition-all shadow-lg">
                    <span class="text-6xl">🦁</span>
                    <span class="text-lg font-black text-blue-400">獅子</span>
                </button>
                <button onclick="selectAnimalAndListen(1)" class="animal-btn bg-slate-900 hover:bg-slate-800 border-2 border-pink-500 rounded-2xl p-6 flex flex-col items-center justify-center space-y-2 active:scale-95 transition-all shadow-lg">
                    <span class="text-6xl">🐰</span>
                    <span class="text-lg font-black text-pink-400">兔子</span>
                </button>
                <button onclick="selectAnimalAndListen(2)" class="animal-btn bg-slate-900 hover:bg-slate-800 border-2 border-yellow-500 rounded-2xl p-6 flex flex-col items-center justify-center space-y-2 active:scale-95 transition-all shadow-lg">
                    <span class="text-6xl">🐵</span>
                    <span class="text-lg font-black text-yellow-400">猴子</span>
                </button>
                <button onclick="selectAnimalAndListen(3)" class="animal-btn bg-slate-900 hover:bg-slate-800 border-2 border-green-500 rounded-2xl p-6 flex flex-col items-center justify-center space-y-2 active:scale-95 transition-all shadow-lg">
                    <span class="text-6xl">🐘</span>
                    <span class="text-lg font-black text-green-400">大象</span>
                </button>
            </div>

            <!-- 音量偵測動態條 -->
            <div id="volume-meter-container" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col space-y-2 flex-shrink-0">
                <div class="flex justify-between items-center text-xs font-bold text-slate-300">
                    <span>🎙️ 當前偵測音量</span>
                    <span id="volume-val-text" class="text-neon-green font-black">0 dB</span>
                </div>
                <div class="w-full bg-slate-950 h-4 rounded-full overflow-hidden border border-slate-800">
                    <div id="volume-bar" class="h-full bg-gradient-to-r from-neon-blue via-neon-green to-neon-pink w-0 transition-all duration-75"></div>
                </div>
                <div class="flex justify-between text-[10px] text-slate-500 font-bold">
                    <span>最小 (+10px)</span>
                    <span>最大 (+60px)</span>
                </div>
            </div>
        </div>

    </main>

    <script>
        // 動物資料陣列
        const animalsConfig = [
            { id: 0, name: "獅子", icon: "🦁" },
            { id: 1, name: "兔子", icon: "🐰" },
            { id: 2, name: "猴子", icon: "🐵" },
            { id: 3, name: "大象", icon: "🐘" }
        ];

        // 大螢幕端紀錄動物位置
        let animalPositions = [0, 0, 0, 0];

        let peer = null;
        let hostConn = null;
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let isListening = false;
        let selectedAnimalIndex = null;

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const hostId = urlParams.get('host');

            if (hostId) {
                // 手機端模式
                document.getElementById('main-header').classList.add('hidden');
                document.getElementById('view-lobby').style.display = 'none';
                document.getElementById('view-player-mobile').classList.remove('hidden');
                document.getElementById('view-player-mobile').classList.add('flex');
                initMobileController(hostId);
            } else {
                // 主機 (大螢幕) 模式
                initHostPeer();
            }
        };

        // --- 大螢幕（Host）邏輯 ---
        function initHostPeer() {
            peer = new Peer();
            
            peer.on('open', (id) => {
                const joinUrl = `${window.location.href.split('?')[0]}?host=${id}`;
                document.getElementById("qrcode").innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: joinUrl,
                    width: 200,
                    height: 200
                });
            });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'MOVE_ANIMAL') {
                        updateAnimalPosition(data.animalIndex, data.step);
                    }
                });
            });
        }

        // 刷新大螢幕上動物位置
        function updateAnimalPosition(index, step) {
            animalPositions[index] += step;
            const el = document.getElementById(`track-animal-${index}`);
            if (el) {
                el.style.transform = `translateX(${animalPositions[index]}px)`;
                el.querySelector('span').innerText = `${animalsConfig[index].name} (+${animalPositions[index]}px)`;
            }
        }

        // --- 手機端（Client）邏輯 ---
        function initMobileController(hostId) {
            peer = new Peer();
            peer.on('open', () => {
                hostConn = peer.connect(hostId);
                hostConn.on('open', () => {
                    document.getElementById('mobile-status-text').innerText = "已連接大螢幕！請點擊選擇動物。";
                });
            });
        }

        // 點擊選擇動物並啟用麥克風判定音量
        async function selectAnimalAndListen(animalIndex) {
            selectedAnimalIndex = animalIndex;
            document.getElementById('mobile-status-text').innerText = `已選擇【${animalsConfig[animalIndex].name}】！對手機大聲喊叫！`;

            if (!isListening) {
                try {
                    // 請求麥克風權限
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    
                    analyser.fftSize = 256;
                    microphone.connect(analyser);

                    isListening = true;
                    processAudioVolume();
                } catch (err) {
                    alert("無法取得麥克風權限，請於瀏覽器允許使用麥克風功能。");
                    console.error(err);
                }
            }
        }

        // 即時讀取麥克風音量並換算位移量 10 ~ 60
        function processAudioVolume() {
            if (!isListening) return;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            // 計算平均音量幅度 (0 - 255)
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let averageVolume = sum / dataArray.length;

            // UI 音量條更新 (以 0-100% 呈現)
            const percent = Math.min(100, Math.round((averageVolume / 128) * 100));
            document.getElementById('volume-bar').style.width = `${percent}%`;
            document.getElementById('volume-val-text').innerText = `${percent} %`;

            // 設定啟動門檻（避免背景雜音誤觸，例如平均音量 > 20 才算喊叫）
            if (averageVolume > 20 && selectedAnimalIndex !== null) {
                // 將 20 ~ 128 的音量對映映射至位移量 10 ~ 60
                const normalized = Math.min(1, (averageVolume - 20) / (128 - 20));
                const step = Math.round(10 + normalized * (60 - 10)); // 得到 10 到 60 之間的像素值

                // 發送數據至大螢幕
                if (hostConn && hostConn.open) {
                    hostConn.send({
                        type: 'MOVE_ANIMAL',
                        animalIndex: selectedAnimalIndex,
                        step: step
                    });
                }
            }

            // 保持每 300 毫秒判定發送一次，避免訊號過於密集的網路阻塞
            setTimeout(() => {
                requestAnimationFrame(processAudioVolume);
            }, 300);
        }
    </script>
</body>
</html>

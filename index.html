<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安得烈食物銀行知識大亂鬥 - 喊名字動物賽跑</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS & QRCode.js -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            blue: '#00f3ff',
                            purple: '#b000ff',
                            pink: '#ff007f',
                            green: '#00ff66',
                            yellow: '#ffcc00'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            user-select: none;
            overflow: hidden;
        }

        #qrcode canvas, #qrcode img {
            margin: 0 auto;
            display: block;
            max-width: 100%;
            height: auto;
        }

        .animal-racer {
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-purple-950 to-slate-950">

    <!-- 頂部 Header -->
    <header id="main-header" class="w-full px-6 py-3 border-b border-slate-800 bg-slate-900/60 backdrop-blur-md flex justify-between items-center z-10 flex-shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🍞</span>
            <h1 class="text-2xl md:text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-neon-blue via-neon-purple to-neon-pink">
                安得烈食物銀行知識大亂鬥 - 喊名字動物大亂鬥
            </h1>
        </div>
    </header>

    <!-- 主要內容區域 -->
    <main class="flex-grow flex items-center justify-center p-4 relative overflow-hidden">

        <!-- 大螢幕畫面 -->
        <div id="view-lobby" class="w-full max-w-[96vw] h-full max-h-[90vh] bg-slate-900/80 border-2 border-slate-700/80 rounded-2xl p-6 shadow-2xl backdrop-blur-xl relative flex flex-col justify-between overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center h-full">
                
                <!-- 左側：QR Code -->
                <div class="md:col-span-4 flex flex-col items-center justify-center border-r border-slate-700/80 pr-6 h-full">
                    <h2 class="text-xl font-bold text-neon-blue mb-2">📱 請用手機掃碼連線</h2>
                    <div class="p-4 bg-gradient-to-br from-cyan-400 via-purple-500 to-pink-500 rounded-2xl shadow-[0_0_50px_rgba(0,243,255,0.4)] my-auto">
                        <div id="qrcode" class="bg-white p-3 rounded-xl flex items-center justify-center shadow-inner"></div>
                    </div>
                    <p class="text-xs text-slate-400 mt-3 text-center">連線後直接對手機喊出【動物名字】<br>聲音越大聲，移動距離越遠！</p>
                </div>

                <!-- 右側：4條動物賽道 (大螢幕) -->
                <div class="md:col-span-8 flex flex-col justify-center h-full space-y-4 px-2">
                    <h2 class="text-2xl font-black text-neon-yellow flex items-center gap-2 mb-2">
                        <span>🏁</span> 動物競技場 (喊名字即時移動)
                    </h2>

                    <div id="race-tracks" class="space-y-3 w-full bg-slate-950/80 p-4 rounded-2xl border border-slate-800">
                        <div class="relative w-full bg-slate-900 border border-slate-800 rounded-xl p-2 h-16 flex items-center overflow-hidden">
                            <div class="absolute right-3 text-slate-600 font-black text-sm z-0">終點 🏁</div>
                            <div id="track-animal-0" class="animal-racer relative z-10 flex items-center gap-2 text-4xl" style="transform: translateX(0px);">
                                🦁 <span class="text-xs text-neon-blue font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">獅子 (0px)</span>
                            </div>
                        </div>

                        <div class="relative w-full bg-slate-900 border border-slate-800 rounded-xl p-2 h-16 flex items-center overflow-hidden">
                            <div class="absolute right-3 text-slate-600 font-black text-sm z-0">終點 🏁</div>
                            <div id="track-animal-1" class="animal-racer relative z-10 flex items-center gap-2 text-4xl" style="transform: translateX(0px);">
                                🐰 <span class="text-xs text-neon-pink font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">兔子 (0px)</span>
                            </div>
                        </div>

                        <div class="relative w-full bg-slate-900 border border-slate-800 rounded-xl p-2 h-16 flex items-center overflow-hidden">
                            <div class="absolute right-3 text-slate-600 font-black text-sm z-0">終點 🏁</div>
                            <div id="track-animal-2" class="animal-racer relative z-10 flex items-center gap-2 text-4xl" style="transform: translateX(0px);">
                                🐵 <span class="text-xs text-neon-yellow font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">猴子 (0px)</span>
                            </div>
                        </div>

                        <div class="relative w-full bg-slate-900 border border-slate-800 rounded-xl p-2 h-16 flex items-center overflow-hidden">
                            <div class="absolute right-3 text-slate-600 font-black text-sm z-0">終點 🏁</div>
                            <div id="track-animal-3" class="animal-racer relative z-10 flex items-center gap-2 text-4xl" style="transform: translateX(0px);">
                                🐘 <span class="text-xs text-neon-green font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">大象 (0px)</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 手機端畫面 -->
        <div id="view-player-mobile" class="hidden fixed inset-0 z-50 bg-slate-950 p-6 flex-col justify-between overflow-hidden">
            <div class="text-center space-y-2 flex-shrink-0">
                <span class="text-4xl">🍞</span>
                <h2 class="text-2xl font-black text-neon-blue">語音感應控制器</h2>
                <p id="mobile-status-text" class="text-neon-yellow font-bold text-base">正在連接大螢幕...</p>
            </div>

            <div class="space-y-3 my-auto w-full">
                <div class="text-center text-slate-400 font-bold text-sm">對手機大喊下列動物名字：</div>
                <div id="mobile-animals-grid" class="grid grid-cols-2 gap-4 w-full p-2">
                    <div class="bg-slate-900 border-2 border-blue-500/60 rounded-2xl p-4 flex flex-col items-center justify-center space-y-1">
                        <span class="text-5xl">🦁</span>
                        <span class="text-lg font-black text-blue-400">喊「獅子」</span>
                    </div>
                    <div class="bg-slate-900 border-2 border-pink-500/60 rounded-2xl p-4 flex flex-col items-center justify-center space-y-1">
                        <span class="text-5xl">🐰</span>
                        <span class="text-lg font-black text-pink-400">喊「兔子」</span>
                    </div>
                    <div class="bg-slate-900 border-2 border-yellow-500/60 rounded-2xl p-4 flex flex-col items-center justify-center space-y-1">
                        <span class="text-5xl">🐵</span>
                        <span class="text-lg font-black text-yellow-400">喊「猴子」</span>
                    </div>
                    <div class="bg-slate-900 border-2 border-green-500/60 rounded-2xl p-4 flex flex-col items-center justify-center space-y-1">
                        <span class="text-5xl">🐘</span>
                        <span class="text-lg font-black text-green-400">喊「大象」</span>
                    </div>
                </div>
            </div>

            <div class="space-y-4 w-full flex-shrink-0">
                <button id="btn-start-speech" onclick="startSpeechAndAudio()" class="w-full py-4 bg-gradient-to-r from-neon-green to-neon-blue text-slate-950 font-black text-xl rounded-2xl shadow-lg border-2 border-white/40 active:scale-95 transition">
                    🎙️ 開始語音感應賽跑
                </button>

                <div id="volume-meter-container" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col space-y-2">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-300">
                        <span>辨識結果：<span id="speech-result-text" class="text-neon-yellow">等待開口...</span></span>
                        <span id="volume-val-text" class="text-neon-green font-black">0 %</span>
                    </div>
                    <div class="w-full bg-slate-950 h-4 rounded-full overflow-hidden border border-slate-800">
                        <div id="volume-bar" class="h-full bg-gradient-to-r from-neon-blue via-neon-green to-neon-pink w-0 transition-all duration-75"></div>
                    </div>
                    <!-- 連線發送狀態觸發提示 -->
                    <div id="send-log-text" class="text-center text-xs text-neon-blue font-extrabold h-4"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const animalsConfig = [
            { id: 0, name: "獅子", keywords: ["獅子", "獅"], icon: "🦁" },
            { id: 1, name: "兔子", keywords: ["兔子", "兔"], icon: "🐰" },
            { id: 2, name: "猴子", keywords: ["猴子", "猴"], icon: "🐵" },
            { id: 3, name: "大象", keywords: ["大象", "象"], icon: "🐘" }
        ];

        let animalPositions = [0, 0, 0, 0];
        let peer = null;
        let hostConn = null;

        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let recognition = null;
        let currentPeakVolume = 0;
        let isStarted = false;

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const hostId = urlParams.get('host');

            if (hostId) {
                document.getElementById('main-header').classList.add('hidden');
                document.getElementById('view-lobby').style.display = 'none';
                document.getElementById('view-player-mobile').classList.remove('hidden');
                document.getElementById('view-player-mobile').classList.add('flex');
                initMobileController(hostId);
            } else {
                initHostPeer();
            }
        };

        function initHostPeer() {
            peer = new Peer();
            peer.on('open', (id) => {
                const joinUrl = `${window.location.href.split('?')[0]}?host=${id}`;
                document.getElementById("qrcode").innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: joinUrl,
                    width: 200,
                    height: 200
                });
            });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'MOVE_ANIMAL') {
                        updateAnimalPosition(data.animalIndex, data.step);
                    }
                });
            });
        }

        function updateAnimalPosition(index, step) {
            animalPositions[index] += step;
            const el = document.getElementById(`track-animal-${index}`);
            if (el) {
                // 強制套用移動
                el.style.transform = `translateX(${animalPositions[index]}px)`;
                const label = el.querySelector('span');
                if (label) {
                    label.innerText = `${animalsConfig[index].name} (+${animalPositions[index]}px)`;
                }
            }
        }

        function initMobileController(hostId) {
            peer = new Peer();
            peer.on('open', () => {
                hostConn = peer.connect(hostId);
                hostConn.on('open', () => {
                    document.getElementById('mobile-status-text').innerText = "🟢 已成功連線至大螢幕！";
                });
                hostConn.on('error', (err) => {
                    document.getElementById('mobile-status-text').innerText = "❌ 連線失敗，請重新掃碼！";
                });
            });
        }

        async function startSpeechAndAudio() {
            if (isStarted) return;

            try {
                // 1. 收音
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                analyser.fftSize = 256;
                microphone.connect(analyser);

                trackVolumePeak();

                // 2. 語音辨識
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("手機瀏覽器不支援 Web Speech 語音辨識！請使用 Chrome 瀏覽器開啓！");
                    return;
                }

                recognition = new SpeechRecognition();
                recognition.lang = 'zh-TW';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onresult = (event) => {
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        const transcript = event.results[i][0].transcript.trim();
                        document.getElementById('speech-result-text').innerText = `「${transcript}」`;

                        animalsConfig.forEach((animal) => {
                            const isMatched = animal.keywords.some(kw => transcript.includes(kw));
                            if (isMatched) {
                                // 將音量映射至 10 - 60 px 之間
                                const normalized = Math.min(1, Math.max(0, currentPeakVolume / 100));
                                const step = Math.round(10 + normalized * (60 - 10));

                                if (hostConn && hostConn.open) {
                                    hostConn.send({
                                        type: 'MOVE_ANIMAL',
                                        animalIndex: animal.id,
                                        step: step
                                    });
                                    document.getElementById('send-log-text').innerText = `🚀 已送出【${animal.name}】前進 +${step}px`;
                                    setTimeout(() => { document.getElementById('send-log-text').innerText = ''; }, 1500);
                                } else {
                                    document.getElementById('send-log-text').innerText = `⚠️ 尚未連線至大螢幕`;
                                }
                            }
                        });
                    }
                };

                recognition.onend = () => {
                    if (isStarted) {
                        try { recognition.start(); } catch(e) {}
                    }
                };

                recognition.start();
                isStarted = true;

                document.getElementById('btn-start-speech').innerText = "🎙️ 語音感應中...請大喊！";
                document.getElementById('btn-start-speech').classList.replace('from-neon-green', 'from-emerald-600');

            } catch (err) {
                alert("無法存取麥克風，請檢查瀏覽器設定！");
                console.error(err);
            }
        }

        function trackVolumePeak() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let avgVolume = sum / dataArray.length;

            if (avgVolume > currentPeakVolume) {
                currentPeakVolume = avgVolume;
            } else {
                currentPeakVolume = Math.max(0, currentPeakVolume - 1);
            }

            const percent = Math.min(100, Math.round((avgVolume / 128) * 100));
            document.getElementById('volume-bar').style.width = `${percent}%`;
            document.getElementById('volume-val-text').innerText = `${percent} %`;

            requestAnimationFrame(trackVolumePeak);
        }
    </script>
</body>
</html>
